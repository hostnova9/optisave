<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lock & Allocation | OptiSave</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/lock-allocation.css"></head><body><div class="page allocation-form-shell"><header class="page-header"><button class="back-btn" onclick="goBackToActivePlans()">←</button><div><h2>Lock & Allocation</h2><p>Lock once, then receive scheduled releases.</p></div></header><div class="form-layout"><main>
<section class="card"><h3>Plan details</h3><div class="field-grid"><div><label>Plan Name</label><input id="planName" type="text" placeholder="e.g. Business Capital"></div><div><label>Purpose</label><select id="purpose"><option value="">Choose purpose</option><option>Rent</option><option>School Fees</option><option>Business</option><option>Travel</option><option>Emergency</option><option>Investment</option><option value="custom">Other / Custom</option></select></div></div><div id="customPurposeWrap" hidden><label>Custom purpose</label><input id="customPurpose" type="text" placeholder="Enter your purpose"></div><label>Total Amount to Lock</label><input type="number" id="lockAmount" min="1" placeholder="₦100,000"></section>
<section class="card"><h3>Schedule</h3><div class="field-grid"><div><label>Lock Duration</label><select id="durationSelect"><option value="">Choose duration</option><option value="21">21 Days</option><option value="30">30 Days</option><option value="45">45 Days</option><option value="60">60 Days</option><option value="90">90 Days</option><option value="180">180 Days</option><option value="custom">Custom</option></select></div><div><label>Allocation Percentage</label><select id="allocationSelect"><option value="">Choose percentage</option><option value="10">10%</option><option value="20">20%</option><option value="30">30%</option><option value="40">40%</option><option value="50">50%</option><option value="60">60%</option><option value="70">70%</option><option value="80">80%</option></select></div></div><div id="customDurationWrap" hidden><label>Custom Duration (days)</label><input type="number" id="customDuration" min="21" placeholder="Minimum 21 days"></div><label>Release Frequency</label><select id="allocationFrequency"><option value="daily" selected>Daily</option><option value="weekly">Weekly</option></select><label>When should allocation releases start?</label><select id="allocationStartMode"><option value="now">Start Now</option><option value="later">Choose Start Date</option></select><div id="allocationScheduledStart" hidden><label>Allocation Start Date</label><input type="date" id="startDate"></div><label class="toggle-row"><input type="checkbox" id="excludeWeekend"><span><b>Exclude weekends</b><small>Release only on weekdays.</small></span></label></section>
</main><aside><section class="smart-summary"><div class="summary-head"><span>LIVE SUMMARY</span><h3>Your plan at a glance</h3></div><div class="summary-grid"><div><small>Amount</small><strong id="sumAmount">₦0</strong></div><div><small>Allocation</small><strong id="sumAllocation">—</strong></div><div><small>Still locked</small><strong id="sumLocked">—</strong></div><div><small>Duration</small><strong id="sumDuration">—</strong></div><div><small>Frequency</small><strong id="sumFrequency">Daily</strong></div><div><small>Releases</small><strong id="sumReleases">—</strong></div><div><small>First release</small><strong id="sumFirst">5:00 AM</strong></div><div><small>Maturity</small><strong id="sumMaturity">—</strong></div></div><p id="summaryNote">Choose your details to preview the plan.</p></section></aside></div><button id="continueBtn" class="primary-btn">Continue to Review</button></div><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/storage.js"></script><script src="js/lock-allocation.js"></script></body></html>
