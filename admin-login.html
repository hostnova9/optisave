<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OptiSave Admin Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">
<main class="admin-login-shell">
  <section class="admin-login-brand">
    <div class="admin-logo"><i class="fa-solid fa-lock"></i></div>
    <span>Opti<span class="brand-save">Save</span></span>
    <small>Administration</small>
  </section>
  <section class="admin-login-card">
    <h1>Admin Sign In</h1>
    <p>Secure administrator access.</p>
    <form id="adminLoginForm">
      <label>Admin email</label>
      <input id="adminEmail" type="email" autocomplete="username" placeholder="admin@optisave.local" required>
      <label>Password</label>
      <div class="password-wrap">
        <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Enter password" required>
        <button type="button" id="togglePassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
      </div>
      <div id="adminLoginError" class="admin-error" hidden></div>
      <button class="primary-admin-btn" type="submit">Sign In</button>
    </form>
    
    <a class="back-user" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to OptiSave</a>
  </section>
</main>
<script src="js/admin-api.js"></script><script src="js/admin-login.js"></script>
</body>
</html>
