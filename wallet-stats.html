<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet Stats</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/wallet-stats.css">

</head>

<body>

<div class="page">

    <!-- Header -->

    <div class="page-header">

        <button class="back-btn"
                onclick="goBackToAvailableBalance()">

            ←

        </button>

        <div class="page-title">

            <h1>Wallet Stats</h1>

            <p>

                View your wallet performance and activity.

            </p>

        </div>

    </div>

    <!-- Wallet Balance -->

    <div class="premium-card">

        <div class="card-title">

            Wallet Balance

        </div>

        <h1 id="walletBalance">

            ₦0

        </h1>

    </div>

    <!-- Statistics -->

    <div class="stats-grid">

        <div class="stat-card">

            <h3>Total Deposited</h3>

            <h2 id="totalDeposited">

                ₦0

            </h2>

        </div>

        <div class="stat-card">

            <h3>Total Withdrawn</h3>

            <h2 id="totalWithdrawn">

                ₦0

            </h2>

        </div>

        <div class="stat-card">

            <h3>Total Locked</h3>

            <h2 id="totalLocked">

                ₦0

            </h2>

        </div>

        <div class="stat-card">

            <h3>Total Credited</h3>

            <h2 id="totalCredited">

                ₦0

            </h2>

        </div>

    </div>

</div>

<script src="js/api.js"></script><script src="js/auth-guard.js"></script>
<script src="js/storage.js"></script>
<script src="js/navigation.js"></script>
<script src="js/wallet-stats.js"></script>

</body>

</html>
