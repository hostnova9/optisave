<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions | OptiSave</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/transactions.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><main class="tx-page">
<header><button onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button><div><h1>Transaction History</h1><p>Deposits, withdrawals, savings deductions and releases in one place.</p></div></header>
<section class="tx-summary"><div><span>Available Balance</span><b id="balance">₦0</b></div><div><span>Total Deposited</span><b id="deposited">₦0</b></div><div><span>Total Withdrawn</span><b id="withdrawn">₦0</b></div></section>
<section class="filters"><button class="active" data-filter="all">All</button><button data-filter="deposit">Deposits</button><button data-filter="withdrawal">Withdrawals</button><button data-filter="saving">Savings</button><button data-filter="credit">Releases</button></section>
<section id="txList" class="tx-list"></section><section id="empty" class="empty"><i class="fa-solid fa-receipt"></i><h3>No transactions yet</h3><p>Your OptiSave activity will appear here.</p></section>
</main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/storage.js"></script><script src="js/transactions.js"></script></body></html>
