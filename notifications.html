<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | OptiSave</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/notifications.css"></head><body><main class="notice-page"><header><button onclick="location.href='profile.html'"><i class="fa-solid fa-arrow-left"></i></button><div><h1>Notifications</h1><p>Account activity and savings alerts</p></div></header><section class="notice-settings"><div><h2>Notification preferences</h2><p>Choose the alerts you want to see in OptiSave.</p></div><label><span>Money activity<small>Deposits, withdrawals and wallet credits</small></span><input type="checkbox" id="moneyAlerts" checked></label><label><span>Savings activity<small>Deductions, allocations, emergency access and maturity</small></span><input type="checkbox" id="savingAlerts" checked></label><label><span>Reminders<small>Upcoming deductions and important plan status</small></span><input type="checkbox" id="reminderAlerts" checked></label></section><section class="notice-history"><div class="notice-title"><div><h2>Notification history</h2><p id="noticeCount">No unread notifications</p></div><button id="markRead">Mark all read</button></div><div id="noticeItems"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/storage.js"></script><script src="js/notifications.js"></script></body></html>
